name: tests

# 每次 push / PR 都跑。发版 workflow 也会再跑一次 —— 那次是发版前的最后一道闸，
# 不是重复：Release 是不可回收的，测试不过的包发出去，装它的人会以为它可用。

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # tests/test_dsh_adapter_offline.py 会真正 import plugin.mjs；显式固定 Node，
      # 避免 runner 恰好没有 Node 时 pytest 把关键 Adapter 回归标成 skip。
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pipx install uv
      - name: 契约测试 + 纯度守卫
        # --extra dev 才会带上 pytest（本机 venv 里碰巧有，CI 是干净环境）
        run: uv run --extra dev pytest tests/ -q
      - name: 示例必须能脱离宿主跑通
        # 「无 io、无 API key、无网络」是这个包对外的核心承诺。
        # 只跑单测证明不了它 —— 单测本来就在仓库里跑。
        run: uv run python examples/quickstart.py
      - name: 不花钱的四层 eval（挑卡 / 落库闸 / 语言 / 语料自查）
        # 这不是重复单测。单测证明"函数按写的那样跑"；这几层证明"跑出来的结果是对的"。
        # 半年里最贵的三次事故都属于后者：管道全通、单测全绿，而用户召不回自己的
        # 记忆、花园自己翻了语言、真记忆被闸门静默吃掉。
        run: uv run --extra dev python evals/run.py --baseline evals/baseline.json

      - name: 落卡质量 eval（真模型）
        # 没 key 就 SKIP 并明说 —— 提示词行为的 bug 只有真模型能暴露，
        # 单测把 agent stub 掉了，什么都验不到。
        env:
          DEEPSEEK_API_KEY: ${{ secrets.EVAL_DEEPSEEK_API_KEY }}
          # Explicitly configurable: provider model IDs are not permanent.
          EVAL_DEEPSEEK_MODEL: ${{ vars.EVAL_DEEPSEEK_MODEL || 'deepseek-flash' }}
        run: uv run --extra dev python evals/capture.py --provider deepseek --model "$EVAL_DEEPSEEK_MODEL"
      - name: 装完之后 CLI 真的能敲
        # [project.scripts] 写错、入口 import 不到，只有真装一次才发现 ——
        # 而「装完能不能用」正是别人愿不愿意继续读下去的门槛。
        run: |
          # 旧版本 wheel 留在 dist 里会让 pip 解析打架
          rm -rf dist
          # 2026-09-06：这里以前还会 `cd packages/agent-protocol-core` 构建
          # 第二个包。那个目录在 0.16.0 已经删掉（思维链处理搬回宿主了），
          # 于是这一步一直失败 —— 而 release 不依赖 tests，照样发版成功。
          # 「主 workflow 红、包照发」是最坏的一种状态：红灯变成了背景噪音。
          uv build
          mkdir -p /tmp/wheels
          cp dist/*.whl /tmp/wheels/
          python -m venv /tmp/cli-check
          # 这个包**零依赖**，所以 --no-index 装得上。装不上就说明有人
          # 悄悄加了依赖 —— 那是要单独讨论的事，不该靠放宽这里蒙混过去。
          /tmp/cli-check/bin/pip install --no-index --find-links /tmp/wheels memgarden
          # ① 命令能敲（[project.scripts] 写错只有真装一次才发现）
          /tmp/cli-check/bin/memgarden manifest > /dev/null
          # ② 能当库用，且**只 import 顶层** —— 这是对外承诺的接入方式
          /tmp/cli-check/bin/python -c "from memgarden import GardenComponent, CaptureRequest"
          echo "CLI + SDK OK"

      - name: wheel 能构建，且带许可证
        run: |
          uv build
          python - <<'PY'
          import zipfile, glob, sys
          whl = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(whl).namelist()
          assert any("LICENSE" in n for n in names), f"wheel 里没有 LICENSE：{whl}"
          print(f"OK {whl} 带许可证")
          PY

  python-compat:
    name: Python ${{ matrix.python-version }} compatibility
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pipx install uv
      - name: 支持版本全量回归
        run: uv run --python ${{ matrix.python-version }} --extra dev pytest -q
