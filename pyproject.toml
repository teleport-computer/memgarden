[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "memgarden"
version = "0.19.0"
description = "可插拔的 AI 记忆编辑内核：落卡、召回、整理与可替换存储编排。"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["memory", "llm", "agent", "long-term-memory"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

# 零依赖，只用标准库。**别往这里加东西** —— 「装了 memgarden 会连带装上什么」
# 是接入方对这个包的第一印象，多一个他不认识的包就多一分困惑。
#
# 2026-09-02 去掉了 agent-protocol-core。内核对「思考」只有一个需求：
# 会思考的模型会把推理和 JSON 混在同一段输出里，要先剥掉推理再解析
# （见 src/memgarden/text/reasoning.py，约 60 行，纯标准库）。
# 而那个包里装的是**宿主的思维链产品实现** —— 人格文案、屏幕监看说辞、
# 宿主专属的开关。接入方装 Garden 不该连带拿到别人产品的这些东西。
dependencies = []

[project.urls]
Homepage = "https://github.com/teleport-computer/memgarden"
Source = "https://github.com/teleport-computer/memgarden"
Issues = "https://github.com/teleport-computer/memgarden/issues"

[project.optional-dependencies]
sqlite = []          # 只用标准库 sqlite3，列在这里是为了让意图显式
dev = [
    "pytest>=8.0",
    "jsonschema>=4.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
# 装完包就能敲命令 —— 这是「别人愿不愿意继续读下去」的最低门槛。
memgarden = "memgarden.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/memgarden"]
# Adapter 的 .mjs / package.json 要进 wheel —— 它们和 Python 代码共用
# 同一套 wire 协议，必须同版本发布，不能拆成单独的 npm 包。
artifacts = ["src/memgarden/adapters/dsh/*.mjs",
             "src/memgarden/adapters/dsh/package.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# 保留空表，便于本地开发时按需添加 workspace source；发布包不依赖它。
[tool.uv.sources]
