[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "memgarden"
version = "0.13.0"
description = "记忆的编辑判断：什么值得记、归哪个桶、几张卡、什么时候该整理。不调模型、不碰存储。"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["memory", "llm", "agent", "long-term-memory"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

# 零依赖，只用标准库。**别往这里加东西** —— 「装了 memgarden 会连带装上什么」
# 是接入方对这个包的第一印象，多一个他不认识的包就多一分困惑。
#
# 2026-09-02 去掉了 agent-protocol-core。内核对「思考」只有一个需求：
# 会思考的模型会把推理和 JSON 混在同一段输出里，要先剥掉推理再解析
# （见 src/memgarden/text/reasoning.py，约 60 行，纯标准库）。
# 而那个包里装的是**宿主的思维链产品实现** —— 人格文案、屏幕监看说辞、
# 宿主专属的开关。接入方装 Garden 不该连带拿到别人产品的这些东西。
dependencies = []

[project.urls]
Homepage = "https://github.com/teleport-computer/memgarden"
Source = "https://github.com/teleport-computer/memgarden"
Issues = "https://github.com/teleport-computer/memgarden/issues"

[project.optional-dependencies]
sqlite = []          # 只用标准库 sqlite3，列在这里是为了让意图显式
dev = ["pytest>=8.0"]

[project.scripts]
# 装完包就能敲命令 —— 这是「别人愿不愿意继续读下去」的最低门槛。
memgarden = "memgarden.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/memgarden"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# 两个包都发布之后，删掉这一节即可 —— 上面的 dependencies 不用改。
[tool.uv.sources]
